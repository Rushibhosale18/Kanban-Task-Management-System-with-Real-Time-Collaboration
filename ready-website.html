<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Kanban System</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Outfit', 'sans-serif'] },
          colors: {
            slate: { 850: '#151e32', 900: '#0f172a', 950: '#020617' }
          },
          animation: {
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          }
        }
      }
    }
  </script>
  
  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background: radial-gradient(circle at top center, #1e1b4b 0%, #0f172a 100%);
      background-attachment: fixed;
      color: #e2e8f0;
      margin: 0;
      height: 100vh;
      overflow: hidden;
    }
    
    .glass {
      background-color: rgba(30, 41, 59, 0.4);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(51, 65, 85, 0.5);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    }
    
    .glass-card {
      background-color: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(71, 85, 105, 0.3);
    }
    
    .task-card {
      cursor: grab;
      transition: all 0.2s ease;
    }
    .task-card:active {
      cursor: grabbing;
      transform: scale(1.02);
      box-shadow: 0 20px 25px -5px rgba(99, 102, 241, 0.2);
      border-color: #6366f1;
    }
    
    .column-dropzone { min-height: 150px; transition: background-color 0.2s; }
    .drag-over { background-color: rgba(51, 65, 85, 0.3); border-radius: 0.5rem; }
    
    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
    ::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.5); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.8); }
  </style>
</head>
<body class="flex flex-col relative">

  <!-- Background glows -->
  <div class="absolute top-[-20%] left-[-10%] w-[500px] h-[500px] rounded-full bg-indigo-600/20 blur-[100px] pointer-events-none animate-pulse-slow z-0"></div>
  <div class="absolute bottom-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-fuchsia-600/10 blur-[120px] pointer-events-none animate-pulse-slow z-0" style="animation-delay: 1s"></div>

  <!-- Header -->
  <header class="glass px-8 py-5 flex items-center justify-between z-10">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center shadow-lg shadow-indigo-500/30">
        <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2" />
        </svg>
      </div>
      <h1 class="text-2xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400">KanbanFlow</h1>
    </div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-slate-300 font-medium">Logged in as <span class="text-white">Rushi</span></span>
      <div class="w-10 h-10 rounded-full bg-slate-800 border-2 border-indigo-500/50 flex items-center justify-center font-bold text-indigo-300 shadow-lg cursor-pointer hover:scale-105 transition-transform">R</div>
    </div>
  </header>

  <!-- Board Area -->
  <main class="flex-1 overflow-x-auto p-8 flex space-x-6 items-start z-10" id="board-container">
    
    <!-- To Do -->
    <div class="glass-card rounded-2xl min-w-[320px] max-w-[320px] flex flex-col overflow-hidden h-full">
      <div class="p-5 border-b border-slate-700/50 bg-slate-800/40 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full shadow-lg bg-blue-500"></div>
          <h3 class="font-bold text-white tracking-wide">To Do</h3>
        </div>
        <span class="count text-xs font-bold text-slate-400 bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-full">2</span>
      </div>
      <div class="p-4 flex-1 overflow-y-auto column-dropzone" id="todo" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
        <!-- Task 1 -->
        <div class="task-card bg-slate-800 p-5 mb-4 rounded-xl border border-slate-600/50 shadow-lg relative overflow-hidden group hover:border-indigo-500/50 hover:shadow-[0_0_15px_rgba(99,102,241,0.15)]" draggable="true" ondragstart="drag(event)" id="task-1">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border bg-rose-500/20 text-rose-300 border-rose-500/30">High</span>
          </div>
          <p class="text-slate-200 text-sm font-medium leading-relaxed mb-4">Design glassmorphism UI components</p>
          <div class="flex justify-between items-center mt-auto">
            <div class="flex items-center gap-1.5 text-slate-500 text-xs font-medium">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
              <span>3</span>
            </div>
            <div class="w-7 h-7 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">R</div>
          </div>
        </div>

        <!-- Task 2 -->
        <div class="task-card bg-slate-800 p-5 mb-4 rounded-xl border border-slate-600/50 shadow-lg relative overflow-hidden group hover:border-indigo-500/50 hover:shadow-[0_0_15px_rgba(99,102,241,0.15)]" draggable="true" ondragstart="drag(event)" id="task-2">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-blue-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border bg-emerald-500/20 text-emerald-300 border-emerald-500/30">Low</span>
          </div>
          <p class="text-slate-200 text-sm font-medium leading-relaxed mb-4">Set up WebSocket connection</p>
          <div class="flex justify-between items-center mt-auto">
            <div class="flex items-center gap-1.5 text-slate-500 text-xs font-medium">
              <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>
              <span>0</span>
            </div>
            <div class="w-7 h-7 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">S</div>
          </div>
        </div>
      </div>
      <button class="m-4 mt-0 py-3 rounded-xl border border-dashed border-slate-600/50 text-slate-400 text-sm font-medium hover:bg-slate-700/30 hover:text-white hover:border-slate-500 transition-all flex items-center justify-center gap-2" onclick="addTask('todo')">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> Add Task
      </button>
    </div>

    <!-- In Progress -->
    <div class="glass-card rounded-2xl min-w-[320px] max-w-[320px] flex flex-col overflow-hidden h-full">
      <div class="p-5 border-b border-slate-700/50 bg-slate-800/40 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full shadow-lg bg-indigo-500"></div>
          <h3 class="font-bold text-white tracking-wide">In Progress</h3>
        </div>
        <span class="count text-xs font-bold text-slate-400 bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-full">1</span>
      </div>
      <div class="p-4 flex-1 overflow-y-auto column-dropzone" id="in-progress" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
        <!-- Task 3 -->
        <div class="task-card bg-slate-800 p-5 mb-4 rounded-xl border border-slate-600/50 shadow-lg relative overflow-hidden group hover:border-indigo-500/50 hover:shadow-[0_0_15px_rgba(99,102,241,0.15)]" draggable="true" ondragstart="drag(event)" id="task-3">
          <div class="absolute left-0 top-0 bottom-0 w-1 bg-indigo-500 opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border bg-rose-500/20 text-rose-300 border-rose-500/30">High</span>
          </div>
          <p class="text-slate-200 text-sm font-medium leading-relaxed mb-4">Write robust drag and drop logic</p>
          <div class="flex justify-between items-center mt-auto">
            <div class="flex items-center gap-1.5 text-slate-500 text-xs font-medium"></div>
            <div class="w-7 h-7 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">R</div>
          </div>
        </div>
      </div>
      <button class="m-4 mt-0 py-3 rounded-xl border border-dashed border-slate-600/50 text-slate-400 text-sm font-medium hover:bg-slate-700/30 hover:text-white hover:border-slate-500 transition-all flex items-center justify-center gap-2" onclick="addTask('in-progress')">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> Add Task
      </button>
    </div>

    <!-- Done -->
    <div class="glass-card rounded-2xl min-w-[320px] max-w-[320px] flex flex-col overflow-hidden h-full">
      <div class="p-5 border-b border-slate-700/50 bg-slate-800/40 flex justify-between items-center">
        <div class="flex items-center gap-3">
          <div class="w-3 h-3 rounded-full shadow-lg bg-emerald-500"></div>
          <h3 class="font-bold text-white tracking-wide">Done</h3>
        </div>
        <span class="count text-xs font-bold text-slate-400 bg-slate-800/80 border border-slate-700 px-2.5 py-1 rounded-full">0</span>
      </div>
      <div class="p-4 flex-1 overflow-y-auto column-dropzone" id="done" ondragover="allowDrop(event)" ondrop="drop(event)" ondragenter="dragEnter(event)" ondragleave="dragLeave(event)">
      </div>
      <button class="m-4 mt-0 py-3 rounded-xl border border-dashed border-slate-600/50 text-slate-400 text-sm font-medium hover:bg-slate-700/30 hover:text-white hover:border-slate-500 transition-all flex items-center justify-center gap-2" onclick="addTask('done')">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg> Add Task
      </button>
    </div>

  </main>

  <script>
    let draggedElement = null;

    function drag(ev) {
      draggedElement = ev.target;
      ev.dataTransfer.setData("text", ev.target.id);
      ev.target.style.opacity = '0.4';
    }

    function allowDrop(ev) { ev.preventDefault(); }
    
    function dragEnter(ev) {
      ev.preventDefault();
      const column = ev.target.closest('.column-dropzone');
      if(column) column.classList.add('drag-over');
    }

    function dragLeave(ev) {
      const column = ev.target.closest('.column-dropzone');
      if(column) column.classList.remove('drag-over');
    }

    function drop(ev) {
      ev.preventDefault();
      const column = ev.target.closest('.column-dropzone');
      
      if(column) {
        column.classList.remove('drag-over');
        const dropTarget = ev.target.closest('.task-card');
        
        if (dropTarget && dropTarget !== draggedElement) {
          const bounding = dropTarget.getBoundingClientRect();
          const offset = bounding.y + (bounding.height / 2);
          if (ev.clientY - offset > 0) dropTarget.after(draggedElement);
          else dropTarget.before(draggedElement);
        } else {
          column.appendChild(draggedElement);
        }
      }
      
      if(draggedElement) {
        draggedElement.style.opacity = '1';
        
        // Update accent color based on column
        const accentLine = draggedElement.querySelector('.absolute.w-1');
        if(accentLine) {
          accentLine.className = 'absolute left-0 top-0 bottom-0 w-1 opacity-0 group-hover:opacity-100 transition-opacity';
          if(column.id === 'todo') accentLine.classList.add('bg-blue-500');
          else if(column.id === 'in-progress') accentLine.classList.add('bg-indigo-500');
          else if(column.id === 'done') accentLine.classList.add('bg-emerald-500');
        }
      }
      updateCounts();
    }
    
    document.addEventListener('dragend', function() {
      if(draggedElement) draggedElement.style.opacity = '1';
    });

    function addTask(columnId) {
      const title = prompt("Enter new task name:");
      if(!title) return;
      
      let accent = 'bg-blue-500';
      if(columnId === 'in-progress') accent = 'bg-indigo-500';
      if(columnId === 'done') accent = 'bg-emerald-500';

      const newId = 'task-' + Math.floor(Math.random() * 10000);
      const html = `
        <div class="task-card bg-slate-800 p-5 mb-4 rounded-xl border border-slate-600/50 shadow-lg relative overflow-hidden group hover:border-indigo-500/50 hover:shadow-[0_0_15px_rgba(99,102,241,0.15)]" draggable="true" ondragstart="drag(event)" id="${newId}">
          <div class="absolute left-0 top-0 bottom-0 w-1 ${accent} opacity-0 group-hover:opacity-100 transition-opacity"></div>
          <div class="flex justify-between items-start mb-3">
            <span class="text-[10px] font-bold uppercase tracking-wider px-2.5 py-1 rounded-full border bg-blue-500/20 text-blue-300 border-blue-500/30">New</span>
          </div>
          <p class="text-slate-200 text-sm font-medium leading-relaxed mb-4">${title}</p>
          <div class="flex justify-between items-center mt-auto">
            <div class="flex items-center gap-1.5 text-slate-500 text-xs font-medium"></div>
            <div class="w-7 h-7 rounded-full bg-slate-700 border border-slate-600 flex items-center justify-center text-[10px] font-bold text-white shadow-sm">U</div>
          </div>
        </div>
      `;
      document.getElementById(columnId).insertAdjacentHTML('beforeend', html);
      updateCounts();
    }

    function updateCounts() {
      ['todo', 'in-progress', 'done'].forEach(col => {
        const count = document.getElementById(col).querySelectorAll('.task-card').length;
        document.getElementById(col).previousElementSibling.querySelector('.count').innerText = count;
      });
    }
  </script>
</body>
</html>
